name: Validate egg

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate egg-project-reclaimer.json is valid JSON
        run: python3 -c "import json; json.load(open('egg-project-reclaimer.json', encoding='utf-8'))"
      - name: Regenerate egg JSON and diff against committed copy
        run: |
          cp egg-project-reclaimer.json /tmp/committed-egg.json
          python3 tools/build_egg.py
          python3 - <<'PY'
          import json
          a = json.load(open('/tmp/committed-egg.json', encoding='utf-8'))
          b = json.load(open('egg-project-reclaimer.json', encoding='utf-8'))
          a.pop('exported_at', None)
          b.pop('exported_at', None)
          assert a == b, (
              "egg-project-reclaimer.json is out of date; run "
              "'python3 tools/build_egg.py' and commit the result"
          )
          PY

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run full unit test suite
        run: python3 -m unittest discover -s tests -v

  shell-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n syntax check
        run: |
          bash -n docker/entrypoint.sh
          bash -n docker/validate-assets.sh
          bash -n scripts/install.sh
          bash -n tests/lib/cleanup.sh
          bash -n tests/test-runtime.sh
          bash -n tests/test-runtime-a-missing-assets.sh
          bash -n tests/test-runtime-b-configuration.sh
          bash -n tests/test-runtime-c-nonroot-fs.sh
          bash -n tests/test-runtime-d-full-startup.sh
          bash -n tests/test-runtime-e-wine-prefix.sh

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ubuntu-latest runner images ship shellcheck preinstalled; calling it
      # directly avoids depending on a third-party Action (the previous
      # ludeeus/action-shellcheck@master — floating, unpinned, and last
      # released in 2023 — was the source of this workflow's Node 20
      # deprecation warnings).
      - name: Run ShellCheck
        run: |
          shellcheck --version
          find . -path ./.git -prune -o -name '*.sh' -print0 \
            | xargs -0 shellcheck

  docker-build:
    runs-on: ubuntu-latest
    # Builds the wrapper image to catch Dockerfile errors and confirm the
    # upstream base image is pullable. Deliberately a separate job from
    # docker-runtime-tests below (rather than one combined, continue-on-
    # error-masked step) so a Dockerfile/build failure and a runtime test
    # failure show up as two distinct, honestly-reported check results.
    # Never pushes anywhere; publishing is a deliberate, separate,
    # tag/manually-triggered workflow (see .github/workflows/publish.yml
    # and README.md "Publishing the image").
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t project-reclaimer-pterodactyl:ci .
      - name: Save image for the runtime-tests job
        run: docker save project-reclaimer-pterodactyl:ci -o /tmp/project-reclaimer-pterodactyl-ci.tar
      - uses: actions/upload-artifact@v4
        with:
          name: project-reclaimer-pterodactyl-ci-image
          path: /tmp/project-reclaimer-pterodactyl-ci.tar
          retention-days: 1

  docker-runtime-tests:
    needs: docker-build
    runs-on: ubuntu-latest
    # Runs the automatable runtime tests (A/B/C — no game assets required)
    # against the image docker-build just produced. This job failing means
    # the image builds fine but behaves incorrectly at runtime, which is a
    # materially different signal than docker-build failing outright.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: project-reclaimer-pterodactyl-ci-image
          path: /tmp
      - name: Load image
        run: docker load -i /tmp/project-reclaimer-pterodactyl-ci.tar
      - name: Run runtime tests A/B/C
        env:
          IMAGE: project-reclaimer-pterodactyl:ci
        run: |
          chmod +x tests/test-runtime*.sh
          tests/test-runtime.sh

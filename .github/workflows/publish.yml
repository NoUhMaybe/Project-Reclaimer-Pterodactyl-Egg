name: Publish image to GHCR

# Deliberately NOT triggered on every push to main — only on an explicit,
# reviewed action: pushing a version tag (v0.1.0 etc.) or a manual
# workflow_dispatch run. See README.md "Publishing the image".
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      reclaimer_version:
        description: "Upstream RECLAIMER_VERSION build arg to pin (ghcr.io/projectreclaimer/project-reclaimer-dedicated tag)"
        required: false
        default: "0.9.20"
      release_tag:
        description: "Release only: existing Git tag matching VERSION and the selected source commit"
        required: false
        type: string
      tag_latest:
        description: "Must remain false; mutable latest aliases require a separate approved action"
        type: boolean
        required: false
        default: false
      source_sha:
        description: "Test images only: full current trusted Console Manager PR head SHA (must match the workflow branch)"
        required: false
        type: string
      test_tag:
        description: "Test only: unused console-manager-pr5-test.N or console-manager-pr5-reclaimer-0.9.20-test.N tag matching the reviewed branch"
        required: false
        type: string

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/nouhmaybe/project-reclaimer-pterodactyl

jobs:
  test-then-publish:
    if: github.event_name == 'push' || (inputs.test_tag == '' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    concurrency:
      group: ghcr-immutable-release-publish
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      UPSTREAM_VERSION: ${{ inputs.reclaimer_version }}
      TAG_LATEST: ${{ inputs.tag_latest || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate exact tag, source, egg, upstream and unused image version
        id: release
        run: python tools/check_release.py --publishing
      - name: Run complete unit and installer regression suite
        run: python -m unittest discover -s tests -v
      - name: Check shell syntax and ShellCheck
        run: |
          find . -path ./.git -prune -o -name '*.sh' -print0 | xargs -0 -n 1 bash -n
          find . -path ./.git -prune -o -name '*.sh' -print0 | xargs -0 shellcheck
      - uses: docker/setup-buildx-action@v3
      - name: Build the release candidate without pushing
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          build-args: RECLAIMER_VERSION=${{ steps.release.outputs.upstream }}
          tags: project-reclaimer-pterodactyl:release-check
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
      - name: Test the actual candidate image before publication
        env:
          IMAGE: project-reclaimer-pterodactyl:release-check
        run: bash tests/test-runtime.sh
      - name: Recheck identity and refuse any existing immutable tag immediately before push
        run: python tools/check_release.py --publishing
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push only the exact tested versioned image
        env:
          RELEASE_IMAGE: ${{ steps.release.outputs.image }}
        run: |
          docker tag project-reclaimer-pterodactyl:release-check "$RELEASE_IMAGE"
          docker push "$RELEASE_IMAGE"
      - name: Verify the published digest, source, version and platform anonymously
        run: python tools/check_release.py --verify-published
      - uses: actions/upload-artifact@v4
        with:
          name: validated-egg-${{ steps.release.outputs.version }}
          path: egg-project-reclaimer.json
          retention-days: 30

  test-build:
    if: github.event_name == 'workflow_dispatch' && inputs.test_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      sha: ${{ steps.guard.outputs.sha }}
      test_tag: ${{ steps.guard.outputs.test_tag }}
      sha_tag: ${{ steps.guard.outputs.sha_tag }}
      upstream: ${{ steps.guard.outputs.upstream }}
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      TEST_TAG: ${{ inputs.test_tag }}
      TAG_LATEST: ${{ inputs.tag_latest }}
      UPSTREAM_VERSION: ${{ inputs.reclaimer_version }}
      LOCAL_IMAGE: project-reclaimer-pterodactyl:pr5-test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Confirm trusted source SHA and all seven CI jobs
        id: guard
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          test -z "$(git status --porcelain)"
          python tools/test_image.py guard
      - name: Recheck unit, supervision, shell and egg validation
        run: |
          python -m unittest discover -s tests -v
          find . -path ./.git -prune -o -name '*.sh' -print0 | xargs -0 -n 1 bash -n
          find . -path ./.git -prune -o -name '*.sh' -print0 | xargs -0 shellcheck
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from tools.build_egg import build
          actual = json.loads(Path('egg-project-reclaimer.json').read_text())
          expected = build()
          actual.pop('exported_at', None)
          expected.pop('exported_at', None)
          assert actual == expected
          assert 'ARG RECLAIMER_VERSION=' + os.environ['UPSTREAM_VERSION'] + '\n' in Path('Dockerfile').read_text()
          assert 'COPY docker/manager /pterodactyl/manager' in Path('Dockerfile').read_text()
          PY
      - name: Build linux/amd64 test image without publishing credentials
        run: |
          docker build --platform linux/amd64 --build-arg "RECLAIMER_VERSION=$UPSTREAM_VERSION" \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            --label "org.opencontainers.image.version=$TEST_TAG" \
            -t "$LOCAL_IMAGE" .
          python tools/test_image.py inspect
      - name: Verify all console modules inside the built image
        run: |
          docker run --rm --entrypoint python3 --workdir /pterodactyl "$LOCAL_IMAGE" -c 'import importlib, pathlib, pkgutil, manager; import console_bridge, configure; modules = [m.name for m in pkgutil.iter_modules(manager.__path__, "manager.")]; assert len(modules) >= 15; [importlib.import_module(m) for m in modules]; assert all(pathlib.Path(p).is_file() for p in ("entrypoint.sh", "console_bridge.py", "configure.py")); print("Verified modules:", modules)'
      - name: Run container runtime tests A/B/C/E/F (no Halo assets)
        env:
          IMAGE: project-reclaimer-pterodactyl:pr5-test
        run: bash tests/test-runtime.sh
      - name: Save tested image and exact source metadata
        run: docker save "$LOCAL_IMAGE" -o /tmp/pr5-test-image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: pr5-tested-image-${{ github.run_id }}
          path: /tmp/pr5-test-image.tar
          retention-days: 1

  test-publish:
    needs: test-build
    runs-on: ubuntu-latest
    concurrency:
      group: ghcr-console-manager-pr5-test-publish
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      pull-requests: read
      packages: write
    outputs:
      digest: ${{ steps.verify.outputs.digest }}
    env:
      SOURCE_SHA: ${{ needs.test-build.outputs.sha }}
      TEST_TAG: ${{ needs.test-build.outputs.test_tag }}
      SHA_TAG: ${{ needs.test-build.outputs.sha_tag }}
      UPSTREAM_VERSION: ${{ needs.test-build.outputs.upstream }}
      TAG_LATEST: ${{ inputs.tag_latest }}
      LOCAL_IMAGE: project-reclaimer-pterodactyl:pr5-test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.test-build.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: pr5-tested-image-${{ github.run_id }}
          path: /tmp
      - name: Load the exact tested image and verify metadata
        run: |
          docker load -i /tmp/pr5-test-image.tar
          python tools/test_image.py inspect
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reject existing tags and record all current release digests
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/test_image.py reserve
      - name: Push only the two validated experimental tags
        run: |
          docker tag "$LOCAL_IMAGE" "$IMAGE_NAME:$TEST_TAG"
          docker push "$IMAGE_NAME:$TEST_TAG"
          docker tag "$LOCAL_IMAGE" "$IMAGE_NAME:$SHA_TAG"
          docker push "$IMAGE_NAME:$SHA_TAG"
      - name: Independently verify anonymous manifests, source and untouched tags
        id: verify
        run: python tools/test_image.py verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr5-publication-proof-${{ github.run_id }}
          path: |
            production-tags-before.json
            publication.json
          retention-days: 30

  test-verify-public:
    needs: [test-build, test-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SOURCE_SHA: ${{ needs.test-build.outputs.sha }}
      TEST_TAG: ${{ needs.test-build.outputs.test_tag }}
      LOCAL_IMAGE: ghcr.io/nouhmaybe/project-reclaimer-pterodactyl:${{ needs.test-build.outputs.test_tag }}
      EXPECTED_DIGEST: ${{ needs.test-publish.outputs.digest }}
      UPSTREAM_VERSION: ${{ needs.test-build.outputs.upstream }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.test-build.outputs.sha }}
          persist-credentials: false
      - name: Pull on a fresh runner with an empty Docker authentication config
        run: |
          export DOCKER_CONFIG
          DOCKER_CONFIG=$(mktemp -d)
          docker pull --platform linux/amd64 "$LOCAL_IMAGE"
          python tools/test_image.py inspect
          docker run --rm --entrypoint python3 --workdir /pterodactyl "$LOCAL_IMAGE" -c 'import importlib, pathlib, pkgutil, manager; import console_bridge, configure; modules = [m.name for m in pkgutil.iter_modules(manager.__path__, "manager.")]; assert len(modules) >= 15; [importlib.import_module(m) for m in modules]; assert all(pathlib.Path(p).is_file() for p in ("entrypoint.sh", "console_bridge.py", "configure.py")); print("Anonymous pull: linux/amd64; console-manager modules verified:", modules)'
          printf 'Anonymous Docker pull and module imports passed for `%s`.\n' "$LOCAL_IMAGE" >> "$GITHUB_STEP_SUMMARY"
      - name: Independently verify the pulled bundled executable and its actual version
        env:
          IMAGE: ${{ env.LOCAL_IMAGE }}
        run: bash tests/test-runtime-f-upstream-cli.sh

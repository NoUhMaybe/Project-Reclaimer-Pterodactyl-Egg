name: Publish image to GHCR

# Deliberately NOT triggered on every push to main — only on an explicit,
# reviewed action: pushing a version tag (v0.1.0 etc.) or a manual
# workflow_dispatch run. See README.md "Publishing the image".
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      reclaimer_version:
        description: "Upstream RECLAIMER_VERSION build arg to pin (ghcr.io/projectreclaimer/project-reclaimer-dedicated tag)"
        required: false
        default: "0.9.13"
      tag_latest:
        description: "Also push the :latest tag"
        type: boolean
        required: false
        default: false
      source_sha:
        description: "Test images only: full current PR #5 head SHA (must match the selected workflow branch)"
        required: false
        type: string
      test_tag:
        description: "Test images only: an unused console-manager-pr5-test.N tag; leave empty for existing release publishing"
        required: false
        type: string

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/nouhmaybe/project-reclaimer-pterodactyl

jobs:
  test-then-publish:
    # Preserve release-tag behavior; manual release publication stays on main.
    # Feature-branch test publishing has a separate, guarded path below.
    if: github.event_name == 'push' || (inputs.test_tag == '' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Never push an image built from a repository that doesn't pass its
      # own test suite first.
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine build-arg and tags
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "reclaimer_version=${{ github.event.inputs.reclaimer_version }}" >> "$GITHUB_OUTPUT"
            echo "push_latest=${{ github.event.inputs.tag_latest }}" >> "$GITHUB_OUTPUT"
          else
            # Triggered by a vX.Y.Z tag push: keep the Dockerfile's own
            # default RECLAIMER_VERSION, and only push :latest for stable
            # (non-prerelease) tags, e.g. not v0.1.0-beta.1.
            echo "reclaimer_version=" >> "$GITHUB_OUTPUT"
            case "${{ github.ref_name }}" in
              *-*) echo "push_latest=false" >> "$GITHUB_OUTPUT" ;;
              *) echo "push_latest=true" >> "$GITHUB_OUTPUT" ;;
            esac
          fi


      - name: Extract OCI metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ steps.vars.outputs.push_latest == 'true' }}
          labels: |
            org.opencontainers.image.title=Project Reclaimer (Pterodactyl compatibility image)
            org.opencontainers.image.description=Pterodactyl-compatible wrapper around the official Project Reclaimer dedicated server image
            org.opencontainers.image.licenses=MIT
  

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            ${{ steps.vars.outputs.reclaimer_version != '' && format('RECLAIMER_VERSION={0}', steps.vars.outputs.reclaimer_version) || '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  test-build:
    if: github.event_name == 'workflow_dispatch' && inputs.test_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      sha: ${{ steps.guard.outputs.sha }}
      test_tag: ${{ steps.guard.outputs.test_tag }}
      sha_tag: ${{ steps.guard.outputs.sha_tag }}
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      TEST_TAG: ${{ inputs.test_tag }}
      TAG_LATEST: ${{ inputs.tag_latest }}
      UPSTREAM_VERSION: ${{ inputs.reclaimer_version }}
      LOCAL_IMAGE: project-reclaimer-pterodactyl:pr5-test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Confirm trusted source SHA and all seven CI jobs
        id: guard
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          test -z "$(git status --porcelain)"
          python tools/test_image.py guard
      - name: Recheck unit, supervision, shell and egg validation
        run: |
          python -m unittest discover -s tests -v
          find . -path ./.git -prune -o -name '*.sh' -print0 | xargs -0 -n 1 bash -n
          find . -path ./.git -prune -o -name '*.sh' -print0 | xargs -0 shellcheck
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.build_egg import build
          actual = json.loads(Path('egg-project-reclaimer.json').read_text())
          expected = build()
          actual.pop('exported_at', None)
          expected.pop('exported_at', None)
          assert actual == expected
          assert 'ARG RECLAIMER_VERSION=0.9.13' in Path('Dockerfile').read_text()
          assert 'COPY docker/manager /pterodactyl/manager' in Path('Dockerfile').read_text()
          PY
      - name: Build linux/amd64 test image without publishing credentials
        run: |
          docker build --platform linux/amd64 --build-arg RECLAIMER_VERSION=0.9.13 \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            --label "org.opencontainers.image.version=$TEST_TAG" \
            -t "$LOCAL_IMAGE" .
          python tools/test_image.py inspect
      - name: Verify all console modules inside the built image
        run: |
          docker run --rm --entrypoint python3 --workdir /pterodactyl "$LOCAL_IMAGE" -c 'import importlib, pathlib, pkgutil, manager; import console_bridge, configure; modules = [m.name for m in pkgutil.iter_modules(manager.__path__, "manager.")]; assert len(modules) >= 15; [importlib.import_module(m) for m in modules]; assert all(pathlib.Path(p).is_file() for p in ("entrypoint.sh", "console_bridge.py", "configure.py")); print("Verified modules:", modules)'
      - name: Run container runtime tests A/B/C/E (no Halo assets)
        env:
          IMAGE: project-reclaimer-pterodactyl:pr5-test
        run: bash tests/test-runtime.sh
      - name: Save tested image and exact source metadata
        run: docker save "$LOCAL_IMAGE" -o /tmp/pr5-test-image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: pr5-tested-image-${{ github.run_id }}
          path: /tmp/pr5-test-image.tar
          retention-days: 1

  test-publish:
    needs: test-build
    runs-on: ubuntu-latest
    concurrency:
      group: ghcr-console-manager-pr5-test-publish
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      pull-requests: read
      packages: write
    outputs:
      digest: ${{ steps.verify.outputs.digest }}
    env:
      SOURCE_SHA: ${{ needs.test-build.outputs.sha }}
      TEST_TAG: ${{ needs.test-build.outputs.test_tag }}
      SHA_TAG: ${{ needs.test-build.outputs.sha_tag }}
      LOCAL_IMAGE: project-reclaimer-pterodactyl:pr5-test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.test-build.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: pr5-tested-image-${{ github.run_id }}
          path: /tmp
      - name: Load the exact tested image and verify metadata
        run: |
          docker load -i /tmp/pr5-test-image.tar
          python tools/test_image.py inspect
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reject existing tags and record all current release digests
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/test_image.py reserve
      - name: Push only the two validated experimental tags
        run: |
          docker tag "$LOCAL_IMAGE" "$IMAGE_NAME:$TEST_TAG"
          docker push "$IMAGE_NAME:$TEST_TAG"
          docker tag "$LOCAL_IMAGE" "$IMAGE_NAME:$SHA_TAG"
          docker push "$IMAGE_NAME:$SHA_TAG"
      - name: Independently verify anonymous manifests, source and untouched tags
        id: verify
        run: python tools/test_image.py verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr5-publication-proof-${{ github.run_id }}
          path: |
            production-tags-before.json
            publication.json
          retention-days: 30

  test-verify-public:
    needs: [test-build, test-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SOURCE_SHA: ${{ needs.test-build.outputs.sha }}
      TEST_TAG: ${{ needs.test-build.outputs.test_tag }}
      LOCAL_IMAGE: ghcr.io/nouhmaybe/project-reclaimer-pterodactyl:${{ needs.test-build.outputs.test_tag }}
      EXPECTED_DIGEST: ${{ needs.test-publish.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.test-build.outputs.sha }}
          persist-credentials: false
      - name: Pull on a fresh runner with an empty Docker authentication config
        run: |
          export DOCKER_CONFIG
          DOCKER_CONFIG=$(mktemp -d)
          docker pull --platform linux/amd64 "$LOCAL_IMAGE"
          python tools/test_image.py inspect
          docker run --rm --entrypoint python3 --workdir /pterodactyl "$LOCAL_IMAGE" -c 'import importlib, pathlib, pkgutil, manager; import console_bridge, configure; modules = [m.name for m in pkgutil.iter_modules(manager.__path__, "manager.")]; assert len(modules) >= 15; [importlib.import_module(m) for m in modules]; assert all(pathlib.Path(p).is_file() for p in ("entrypoint.sh", "console_bridge.py", "configure.py")); print("Anonymous pull: linux/amd64; console-manager modules verified:", modules)'
          printf 'Anonymous Docker pull and module imports passed for `%s`.\n' "$LOCAL_IMAGE" >> "$GITHUB_STEP_SUMMARY"
